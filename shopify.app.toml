# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Nexus Backin Stock"
embedded = true
client_id = "47cb9e9519a25773a829b4d49a7df9c0"
application_url = "https://backin-stock.vercel.app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory"

[auth]
redirect_urls = [
  "https://backin-stock.vercel.app/auth/callback",
  "https://backin-stock.vercel.app/auth/shopify/callback",
  "https://backin-stock.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

[webhooks.privacy_compliance]
customer_deletion_url = "https://backin-stock.vercel.app/webhooks"
customer_data_request_url = "https://backin-stock.vercel.app/webhooks"
shop_deletion_url = "https://backin-stock.vercel.app/webhooks"

[extensions.theme]
handle = "backinstock-extension"

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://backin-stock.vercel.app"
subpath = "backinstock-notifier"
prefix = "apps"
